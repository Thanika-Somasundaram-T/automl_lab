pipeline_space:
  lr_w:
    type: float
    log: true
    lower: 1e-6
    upper: 1e-2

  lr_alpha:
    type: float
    log: true
    lower: 1e-6
    upper: 1e-2

  weight_decay:
    type: float
    log: true
    lower: 1e-5
    upper: 1e-2

  grad_clip:
    type: float
    lower: 0
    upper: 5.0

  max_epochs:
    type: int
    lower: 4
    upper: 15
    is_fidelity: true

optimizer: hyperband
max_evaluations_total: 20
