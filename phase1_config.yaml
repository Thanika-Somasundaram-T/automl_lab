pipeline_space:
  lr_w:
    type: float
    log: true
    lower: 1e-5
    upper: 1e-2

  lr_alpha:
    type: float
    log: true
    lower: 1e-5
    upper: 1e-2
    prior: 0.0006

  weight_decay:
    type: float
    log: true
    lower: 1e-5
    upper: 1e-2
    prior: 0.0001

  grad_clip:
    type: float
    lower: 0.1
    upper: 5.0

  max_epochs:
    type: int
    lower: 1
    upper: 20
    is_fidelity: true

optimizer: priorband
max_evaluations_total: 20
