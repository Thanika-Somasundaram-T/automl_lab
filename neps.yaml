pipeline_space:
  model:
    type: categorical
    choices: ["resnet50", "efficientnet_b0", "convnext_tiny", "swin_tiny"]

  lr:
    type: float
    log: true
    lower: 1e-5
    upper: 1e-2

  optimizer:
    type: categorical
    choices: [adam, sgd]

  batch_size:
    type: categorical
    choices: [32, 64]

  max_epochs:
    type: int
    lower: 2
    upper: 15
    is_fidelity: true
  
  unfreeze_layers:
    type: int
    lower: 1
    upper: 3

optimizer: hyperband
max_evaluations_total: 50
root_directory: "./neps_results"


