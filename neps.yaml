pipeline_space:
  model:
    type: categorical
    choices: ["resnet50", "efficientnet_v2_s", "swin_tiny"]


  lr:
    type: float
    log: true
    lower: 1e-5
    upper: 1e-2

  optimizer:
    type: categorical
    choices: [adam, sgd]

  batch_size:
    type: int
    lower: 16
    upper: 50

  max_epochs:
    type: int
    lower: 10
    upper: 50
    is_fidelity: true
  
  hidden_dim:
    type: int
    lower: 128
    upper: 512

  dropout:
    type: float
    lower: 0.1
    upper: 0.7

  head_layers:
    type: int
    lower: 1
    upper: 3
  
  unfreeze_layers:
    type: int
    lower: 0
    upper: 2


optimizer: hyperband
max_evaluations_total: 60


