pipeline_space:
  model:
    type: categorical
    choices: [resnet18, resnet34, mobilenet_v2, efficientnet_b0]

  lr:
    type: float
    log: true
    lower: 1e-5
    upper: 1e-2

  optimizer:
    type: categorical
    choices: [adam, sgd]

  batch_size:
    type: categorical
    choices: [32, 64, 128]

  max_epochs:
    type: int
    lower: 5
    upper: 50
    is_fidelity: true

optimizer: hyperband
max_evaluations_total: 20
root_directory: "./neps_results"
