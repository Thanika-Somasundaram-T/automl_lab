pipeline_space:
  model:
    type: categorical
    # choices: [resnet18, resnet34, mobilenet_v2, efficientnet_b0, vit_b_16, deit_tiny, swin_t]
    choices: [vit_b_16, deit_tiny, swin_t]


  lr:
    type: float
    log: true
    lower: 1e-5
    upper: 1e-2

  weight_decay:
    type: float
    log: true
    lower: 1e-6
    upper: 1e-3

  optimizer:
    type: categorical
    choices: [adam, sgd]

  batch_size:
    type: categorical
    choices: [32, 64, 128]

max_evaluations_total: 20
root_directory: "./neps_results"
