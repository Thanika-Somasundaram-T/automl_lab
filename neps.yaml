pipeline_space:
  model:
    type: categorical
    choices: ["resnet50", "efficientnet_b0", "mobilenet_v3_large", "convnext_tiny", "swin_tiny"]


  lr:
    type: float
    log: true
    lower: 1e-4
    upper: 1e-2

  optimizer:
    type: categorical
    choices: [adam, sgd]

  batch_size:
    type: categorical
    choices: [32, 64]

  max_epochs:
    type: int
    lower: 2
    upper: 30
    is_fidelity: true
  
  unfreeze_layers:
    type: int
    lower: 0
    upper: 4

optimizer: hyperband
max_evaluations_total: 60


